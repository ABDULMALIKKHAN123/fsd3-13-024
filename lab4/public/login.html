<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Login | BrightPath</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial;
        background: #f4f7fb;
        color: #1f2937;
      }
      nav {
        background: #173b6c;
        padding: 15px;
        text-align: center;
      }
      nav a {
        color: white;
        text-decoration: none;
        margin: 0 14px;
        font-weight: bold;
      }
      nav a:hover {
        color: #ffd166;
      }
      .wrap {
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;
      }
      .card {
        background: white;
        width: 420px;
        padding: 35px;
        border-radius: 14px;
        box-shadow: 0 5px 20px #0001;
      }
      h1 {
        text-align: center;
        color: #173b6c;
      }
      label {
        display: block;
        margin-top: 16px;
        font-weight: bold;
      }
      input {
        width: 100%;
        padding: 12px;
        margin-top: 7px;
        border: 1px solid #ccd5e0;
        border-radius: 7px;
      }
      button {
        width: 100%;
        margin-top: 22px;
        padding: 12px;
        background: #173b6c;
        color: white;
        border: 0;
        border-radius: 7px;
        font-weight: bold;
      }
      footer {
        background: #102a4c;
        color: white;
        text-align: center;
        padding: 25px;
      }
      footer a {
        color: white;
        margin: 0 10px;
        text-decoration: none;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="registration.html">Registration</a><a href="login.html">Login</a
      ><a href="courses.html">Courses</a><a href="feedback.html">Feedback</a
      ><a href="prices.html">Price Details</a>
    </nav>
    <div class="wrap">
      <div class="card">
        <h1>Student Login</h1>
        <form>
          <label>Email</label
          ><input type="email" placeholder="Enter your email" required /><label
            >Password</label
          ><input
            type="password"
            placeholder="Enter your password"
            required
          /><button type="submit">Login</button>
        </form>
        <p style="text-align: center">
          New student? <a href="registration.html">Register here</a>
        </p>
      </div>
    </div>
    <footer>
      <p>© 2026 BrightPath Tuition Classes</p>
      <p>
        <a href="#">ⓕ</a><a href="#">𝕏</a><a href="#">◎</a><a href="#">▶</a>
      </p>
    </footer>
  </body>
</html>
